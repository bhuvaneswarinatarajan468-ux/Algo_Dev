name: Scan and publish

on:
  workflow_dispatch:
    inputs:
      request_token:
        description: "Fresh Kite request_token (from the address bar after logging in)"
        required: true
        type: string
      short:
        description: "Short SMA"
        default: "6"
        type: string
      long:
        description: "Long SMA"
        default: "30"
        type: string
      lookback:
        description: "Look back (trading days)"
        default: "20"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide the request token in logs
        run: echo "::add-mask::${REQUEST_TOKEN}"
        env:
          REQUEST_TOKEN: ${{ inputs.request_token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run the scan
        run: python scan_to_json.py
        env:
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          REQUEST_TOKEN: ${{ inputs.request_token }}
          SHORT: ${{ inputs.short }}
          LONG: ${{ inputs.long }}
          LOOKBACK: ${{ inputs.lookback }}

      - name: Build the site folder
        run: |
          mkdir site
          cp static/index.html site/index.html
          cp signals.json site/signals.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
